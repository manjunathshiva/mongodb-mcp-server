# GitHub secret-scanning configuration.
#
# Excludes paths that legitimately contain PEM-encoded private keys or other
# secret-shaped material. Anything matched here will not raise secret-scanning
# alerts. Be very conservative about adding entries.
#
# tests/fixtures/x509/  : static self-signed CA + server + client certs used by
#                         the integration test suite to drive an X.509-only
#                         mongod. They chain to nothing real (the CA trusts
#                         only itself) and only matter to ephemeral test
#                         mongods that explicitly trust this CA. See the
#                         README in that directory for the threat model and
#                         the openssl recipe for regenerating them.

paths-ignore:
    - "tests/fixtures/x509/**"
